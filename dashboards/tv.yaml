# Lovelace view for choosing which source each TV shows.
# Entity ids include the area prefix HA adds, for example select.kat_kat_ulaz_source. Adjust them if yours differ
# (Settings > Devices & services > UniFi Pro AV).
title: TV
path: tv
icon: mdi:television-classic
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Sve na jedan izvor
        icon: mdi:television-play
      - type: button
        name: HOME.tv
        icon: mdi:set-top-box
        tap_action:
          action: perform-action
          perform_action: unifi_proav.route
          data:
            source: HOME.tv
          confirmation:
            text: Prebaciti SVE TV-ove na HOME.tv?
      - type: button
        name: Reklame
        icon: mdi:raspberry-pi
        tap_action:
          action: perform-action
          perform_action: unifi_proav.route
          data:
            source: Reklame
          confirmation:
            text: Prebaciti SVE TV-ove na Reklame?
      - type: button
        name: Podrum HDMI
        icon: mdi:projector
        tap_action:
          action: perform-action
          perform_action: unifi_proav.route
          data:
            source: Podrum HDMI
          confirmation:
            text: Prebaciti SVE TV-ove na Podrum HDMI?
  - type: grid
    cards:
      - type: heading
        heading: Preseti
        icon: mdi:playlist-play
      - type: button
        name: Bina HDMI
        icon: mdi:projector-screen
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.bina_hdmi
          confirmation:
            text: Podrum Bina i Podrum Veliki TV na Podrum HDMI izvor?
  - type: grid
    cards:
      - type: heading
        heading: Svaki TV posebno
        icon: mdi:television
      - type: tile
        entity: select.kat_kat_ulaz_source
        name: Kat - ulaz
        features:
          - type: select-options
      - type: tile
        entity: select.prizemlje_prizemlje_klavir_source
        name: Prizemlje - klavir
        features:
          - type: select-options
      - type: tile
        entity: select.prizemlje_prizemlje_pec_source
        name: Prizemlje - peć
        features:
          - type: select-options
      - type: tile
        entity: select.podrum_podrum_veliki_tv_source
        name: Podrum Veliki TV
        features:
          - type: select-options
      - type: tile
        entity: select.podrum_podrum_bina_source
        name: Podrum Bina
        features:
          - type: select-options
